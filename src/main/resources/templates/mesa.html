<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mesas | SR Kitchen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="lg:ml-64 transition-all duration-300">
    
    <!-- Sidebar Navigation -->
    <div th:replace="fragments/layout :: sidebar"></div>
    
    <!-- Mobile Menu Toggle -->
    <div th:replace="fragments/layout :: mobile-menu-toggle"></div>
    
    <!-- Top Header -->
    <div th:replace="fragments/layout :: header"></div>
    
    <!-- Main Content -->
    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-7xl mx-auto">
        
        <!-- Flash Messages -->
        <div th:replace="fragments/components :: messages"></div>
        
        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-4xl font-jakarta font-bold text-primary mb-2">Gestión de Mesas</h1>
                    <p class="text-gray-600 font-work">Administra las mesas de tu restaurante</p>
                </div>
                <button onclick="openModal('createMesaModal')" class="btn-primary">
                    <span class="material-symbols-outlined inline-block mr-2">add</span>
                    Nueva Mesa
                </button>
            </div>

            <!-- Search Bar -->
            <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-3 text-gray-400">search</span>
                <input type="text" id="searchInput" placeholder="Buscar mesa por número o estado..."
                       class="w-full pl-12 pr-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
        </div>

        <!-- Create Mesa Modal -->
        <div id="createMesaModal" data-modal-id="createMesaModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" data-modal-overlay>
            <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-elevation">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-jakarta font-bold text-primary">Nueva Mesa</h2>
                    <button onclick="closeModal('createMesaModal')" class="p-2 hover:bg-bg-light rounded-lg transition-all" data-modal-close>
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <form th:action="@{/mesa/crear}" method="post" th:object="${nuevaMesa}" class="space-y-4">
                    <div>
                        <label for="numMesa" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                            Número de Mesa
                        </label>
                        <input type="number" id="numMesa" th:field="*{num}" min="1" required
                               class="input-focus w-full">
                    </div>
                    <button type="submit" class="btn-primary w-full">
                        <span class="material-symbols-outlined inline-block mr-2">check</span>
                        Crear Mesa
                    </button>
                </form>
            </div>
        </div>

        <!-- Mesas Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="mesasContainer">
            
            <div th:each="mesa : ${listar}" class="mesa-card bg-white rounded-xl border border-gray-200 shadow-md transition-all duration-300 hover:shadow-xl hover:scale-105 p-6 flex flex-col group" data-mesa-num="${mesa.num}" data-mesa-estado="${mesa.ocupado ? 'Ocupada' : 'Disponible'}">
                
                <!-- Header -->
                <div class="flex items-start justify-between mb-4">
                    <div>
                        <h3 class="text-3xl font-jakarta font-bold text-primary">Mesa <span th:text="${mesa.num}"></span></h3>
                        <p class="text-sm text-gray-600 mt-1">ID: <span th:text="${mesa.id != null and mesa.id.length() >= 8 ? mesa.id.substring(0,8) : mesa.id}"></span></p>
                    </div>
                    <span th:if="${mesa.ocupado}" class="chip-danger">
                        <span class="material-symbols-outlined text-sm mr-1">event_busy</span>
                        Ocupada
                    </span>
                    <span th:unless="${mesa.ocupado}" class="chip-success">
                        <span class="material-symbols-outlined text-sm mr-1">check_circle</span>
                        Disponible
                    </span>
                </div>

                <!-- Mesero Asignado -->
                <div class="mb-4 pb-4 border-b border-gray-100">
                    <p class="text-xs text-gray-600 font-work mb-1">MESERO ASIGNADO</p>
                    <p class="font-jakarta font-semibold text-gray-800" th:text="${nombresMeseros[mesa.id]} ?: 'Sin asignar'"></p>
                </div>

                <!-- Pedidos Section -->
                <div th:if="${pedidosPorMesa[mesa.id] != null and !pedidosPorMesa[mesa.id].isEmpty()}" class="flex-1 mb-4 pb-4 border-b border-gray-100">
                    <p class="text-xs text-gray-600 font-work mb-3">PEDIDOS ACTIVOS</p>
                    
                    <div th:each="pedido : ${pedidosPorMesa[mesa.id]}" class="bg-bg-light rounded-lg p-3 mb-2">
                        <div class="flex items-center justify-between mb-2">
                            <p class="font-jakarta font-bold text-gray-800">#<span th:text="${pedido.id != null and pedido.id.length() >= 6 ? pedido.id.substring(0,6) : pedido.id}"></span></p>
                            <span class="text-sm font-work text-gray-600">
                                <span class="material-symbols-outlined inline-block text-base align-middle">schedule</span>
                                <span th:text="${#temporals.format(pedido.fecha, 'HH:mm')}"></span>
                            </span>
                        </div>
                        <p class="text-sm text-gray-600 font-work mb-1">Total: <strong class="text-primary">$<span th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}"></span></strong></p>
                        <p class="text-xs text-gray-500 font-work">Items: <span th:text="${pedido.items.size()}"></span></p>
                    </div>
                </div>

                <div th:if="${pedidosPorMesa[mesa.id] == null or pedidosPorMesa[mesa.id].isEmpty()}" class="flex-1 mb-4 pb-4 border-b border-gray-100">
                    <p class="text-sm text-gray-500 text-center py-4 font-work">No hay pedidos</p>
                </div>

                <!-- Actions -->
                <div class="flex gap-2">
                    <form th:action="@{'/mesa/' + ${mesa.id} + '/generar-factura'}" method="post" class="flex-1"
                          th:if="${mesa.pedidosId != null and !#lists.isEmpty(mesa.pedidosId)}">
                        <button type="submit" class="w-full btn-primary text-sm py-2" 
                                onclick="return confirm('¿Generar factura y liberar mesa?');">
                            <span class="material-symbols-outlined inline-block mr-1">check</span>
                            Facturar
                        </button>
                    </form>

                    <button th:unless="${mesa.pedidosId != null and !#lists.isEmpty(mesa.pedidosId)}"
                            disabled class="flex-1 px-4 py-2 bg-gray-200 text-gray-400 rounded-xl font-jakarta font-semibold cursor-not-allowed text-sm">
                        <span class="material-symbols-outlined inline-block mr-1">lock</span>
                        Facturar
                    </button>

                    <button onclick="openModal('editMesaModal_${mesa.id}')" class="btn-secondary text-sm py-2 px-4">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>

            </div>

        </div>

        <!-- Empty State -->
        <div th:if="${listar == null or listar.isEmpty()}" class="text-center py-16">
            <span class="material-symbols-outlined text-7xl text-gray-300 mb-4 block">table_restaurant</span>
            <h3 class="text-xl font-jakarta font-bold text-gray-400 mb-2">No hay mesas</h3>
            <p class="text-gray-500 font-work mb-4">Crea tu primera mesa para comenzar</p>
            <button onclick="openModal('createMesaModal')" class="btn-primary">
                <span class="material-symbols-outlined inline-block mr-2">add</span>
                Crear Mesa
            </button>
        </div>

    </main>
    
    <!-- Footer -->
    <div th:replace="fragments/components :: footer"></div>
    
    <!-- Scripts -->
    <script th:src="@{/js/mobile-menu.js}"></script>
    <script th:src="@{/js/ui-helpers.js}"></script>
    <script th:src="@{/js/mesa-table.js}"></script>

</body>
</html>
