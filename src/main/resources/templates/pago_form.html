<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago de Factura | SR Kitchen</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="lg:ml-64 transition-all duration-300">

    <!-- Sidebar Navigation -->
    <div th:replace="fragments/layout :: sidebar"></div>

    <!-- Mobile Menu Toggle -->
    <div th:replace="fragments/layout :: mobile-menu-toggle"></div>

    <!-- Top Header -->
    <div th:replace="fragments/layout :: header"></div>

    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-2xl mx-auto">

        <!-- Flash Messages -->
        <div th:replace="fragments/components :: messages"></div>

        <section class="mb-8">
            <div class="flex items-center justify-between gap-4">
                <div>
                    <h1 class="text-4xl font-jakarta font-bold text-primary mb-2">Pago de Factura</h1>
                    <p class="text-gray-600 font-work">Registra el pago, selecciona el método y confirma la transacción.</p>
                </div>
                <a href="/factura" class="btn-secondary inline-flex items-center gap-2">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Volver a Facturas
                </a>
            </div>
        </section>

        <section class="card p-8">
            <form id="pagoForm" th:action="@{/pagos/procesar}" method="post" class="space-y-6">
                <input type="hidden" name="facturaId" th:value="${factura.id}" />

                <div>
                    <label class="block text-sm font-jakarta font-semibold text-gray-700 mb-3">Método de pago</label>
                    <div class="grid gap-3 sm:grid-cols-3">
                        <label class="flex items-center gap-2 rounded-xl border border-gray-200 p-4 cursor-pointer hover:border-primary transition-all">
                            <input type="radio" name="metodo" value="Efectivo" required class="accent-primary" />
                            <span>Efectivo</span>
                        </label>
                        <label class="flex items-center gap-2 rounded-xl border border-gray-200 p-4 cursor-pointer hover:border-primary transition-all">
                            <input type="radio" name="metodo" value="Tarjeta débito" class="accent-primary" />
                            <span>Tarjeta débito</span>
                        </label>
                        <label class="flex items-center gap-2 rounded-xl border border-gray-200 p-4 cursor-pointer hover:border-primary transition-all">
                            <input type="radio" name="metodo" value="Tarjeta crédito" class="accent-primary" />
                            <span>Tarjeta crédito</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label for="monto" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">Monto a pagar</label>
                    <input id="monto" type="number" step="0.01" name="monto" th:value="${factura.total}" required class="input-focus w-full" placeholder="0.00">
                </div>

                <div class="flex items-center gap-3">
                    <input id="imprimirCopia" type="checkbox" name="imprimirCopia" class="accent-primary">
                    <label for="imprimirCopia" class="text-sm text-gray-700">Imprimir copia</label>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <button type="submit" class="btn-primary flex-1 py-3 inline-flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">check</span>
                        Confirmar Pago
                    </button>
                    <a href="/factura" class="btn-secondary flex-1 py-3 inline-flex items-center justify-center gap-2 text-center">
                        <span class="material-symbols-outlined">close</span>
                        Cancelar
                    </a>
                </div>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <div th:replace="fragments/components :: footer"></div>

    <!-- Scripts -->
    <script th:src="@{/js/mobile-menu.js}"></script>
    <script th:src="@{/js/pago-form.js}"></script>
</body>
</html>
