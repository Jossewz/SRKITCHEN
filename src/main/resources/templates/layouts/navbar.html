<div th:fragment="navbar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <header class="h-16 bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 flex items-center justify-between sticky top-0 z-30">
        
        <!-- Izquierda: Toggle móvil y Título de página dinámico -->
        <div class="flex items-center gap-3">
            <!-- Botón drawer móvil -->
            <button type="button"
                    @click="mobileOpen = true"
                    class="md:hidden w-9 h-9 rounded-lg bg-slate-50 border border-slate-200 text-slate-700 flex items-center justify-center hover:bg-slate-100 transition cursor-pointer shrink-0"
                    aria-label="Abrir menú de navegación">
                <i data-lucide="menu" class="w-5 h-5 stroke-[1.75]"></i>
            </button>

            <!-- Título y Subtítulo -->
            <div class="flex flex-col">
                <h1 class="text-base sm:text-lg font-bold font-jakarta text-slate-900 leading-tight" 
                    th:text="${pageTitle ?: 'Dashboard'}">Panel Principal</h1>
                <span class="text-[11px] font-semibold text-slate-500 font-work hidden sm:inline">SR Kitchen &bull; Sistema Operativo de Restaurante</span>
            </div>
        </div>

        <!-- Derecha: Analytics, Separador y Perfil de Usuario -->
        <div class="flex items-center gap-3 ml-auto">
            
            <!-- Acceso a Analytics Power BI (Admin) -->
            <a href="https://app.powerbi.com/view?r=eyJrIjoiZGVhODExZDQtOWEyMi00ODdlLWIzMDQtMWM5Yjc2ZmY4MDZiIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9"
               target="_blank" rel="noopener noreferrer"
               sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-[#0c6780] bg-sky-50 border border-sky-100 hover:bg-sky-100/80 rounded-lg transition-all"
               title="Ver Tablero de Datos en Power BI">
                <i data-lucide="bar-chart-2" class="w-4 h-4 stroke-[2]"></i>
                <span>Power BI</span>
            </a>

            <!-- Separador sutil -->
            <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>

            <!-- Perfil de Usuario con Menú Desplegable Alpine.js -->
            <div class="relative" x-data="{ profileOpen: false }" @click.outside="profileOpen = false">
                <button type="button"
                        @click="profileOpen = !profileOpen"
                        class="flex items-center gap-2.5 p-1.5 rounded-lg hover:bg-slate-100 transition-all cursor-pointer group focus:outline-none"
                        :aria-expanded="profileOpen">
                    
                    <div class="text-right hidden sm:block leading-tight">
                        <strong class="text-xs font-bold text-slate-900 block group-hover:text-[#0c6780] transition-colors"
                                sec:authentication="name">Usuario</strong>
                        <span class="text-[10px] font-bold text-emerald-700 uppercase tracking-wider"
                              sec:authorize="hasAuthority('ROLE_ADMIN')">Administrador</span>
                        <span class="text-[10px] font-bold text-[#0c6780] uppercase tracking-wider"
                              sec:authorize="hasAuthority('ROLE_MESERO')">Mesero</span>
                    </div>

                    <div class="w-8 h-8 rounded-lg bg-[#0c6780] text-white flex items-center justify-center font-bold text-xs shadow-xs"
                         style="background-color: #0c6780;">
                        <span sec:authorize="isAuthenticated()" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                    </div>

                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 group-hover:text-slate-800 transition-transform duration-200"
                       :class="{ 'rotate-180': profileOpen }"></i>
                </button>

                <!-- Menú Desplegable Flotante -->
                <div x-show="profileOpen"
                     x-cloak
                     x-transition:enter="transition ease-out duration-150"
                     x-transition:enter-start="opacity-0 translate-y-1 scale-95"
                     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                     x-transition:leave="transition ease-in duration-100"
                     x-transition:leave-start="opacity-100 scale-100"
                     x-transition:leave-end="opacity-0 scale-95"
                     class="absolute right-0 mt-2 w-64 bg-white rounded-lg border border-slate-200 shadow-xl z-50 overflow-hidden">
                    
                    <div class="p-3.5 bg-slate-50 border-b border-slate-200">
                        <p class="text-[11px] text-slate-500 font-semibold">Sesión activa</p>
                        <p class="text-xs font-bold text-slate-900 truncate" sec:authentication="name">admin@rskitchen.com</p>
                        <div class="mt-1">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800"
                                  sec:authorize="hasAuthority('ROLE_ADMIN')">
                                Rol: Administrador
                            </span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-sky-100 text-sky-800"
                                  sec:authorize="hasAuthority('ROLE_MESERO')">
                                Rol: Mesero
                            </span>
                        </div>
                    </div>

                    <div class="p-1 space-y-0.5">
                        <a href="/home" class="flex items-center gap-2 px-3 py-2 rounded-md text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-[#0c6780] transition-colors">
                            <i data-lucide="layout-dashboard" class="w-4 h-4 stroke-[1.75]"></i>
                            <span>Panel de Control</span>
                        </a>
                        <a href="/foro" class="flex items-center gap-2 px-3 py-2 rounded-md text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-[#0c6780] transition-colors">
                            <i data-lucide="message-square" class="w-4 h-4 stroke-[1.75]"></i>
                            <span>Buzón / Foro</span>
                        </a>
                    </div>

                    <div class="p-1 border-t border-slate-100">
                        <form th:action="@{/logout}" method="post" class="w-full m-0">
                            <button type="submit" class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-xs font-bold text-rose-700 hover:bg-rose-50 transition-colors cursor-pointer text-left">
                                <i data-lucide="log-out" class="w-4 h-4 stroke-[2]"></i>
                                <span>Cerrar Sesión</span>
                            </button>
                        </form>
                    </div>

                </div>
            </div>

        </div>

    </header>
</div>
