<th:block th:fragment="sidebar(activePage)" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- ══════════════════════════════════════════════════════════
         1. SIDEBAR DESKTOP (Colapsable y Persistente - 256px / 74px)
         ══════════════════════════════════════════════════════════ -->
    <aside id="sidebar-desktop"
           class="sticky top-0 h-screen flex flex-col bg-[#0c6780] text-white border-r border-[#095166] overflow-hidden shrink-0 hidden md:flex transition-all duration-300 z-40 select-none"
           :class="sidebarOpen ? 'w-64 p-5' : 'w-[74px] p-3 items-center'"
           style="background-color: #0c6780;">

        <!-- Logo / Marca + Botón Toggle -->
        <div class="flex items-center mb-6 transition-all duration-200 w-full"
             :class="sidebarOpen ? 'justify-between px-1' : 'justify-center'">
            
            <a th:href="${#authorization.expression('hasAuthority(''ROLE_CREATOR'')') ? '/admin/restaurantes' : '/home'}" 
               x-show="sidebarOpen" 
               x-cloak 
               class="flex items-center gap-2.5 min-w-0" 
               aria-label="SR Kitchen">
                <div class="w-9 h-9 rounded-lg bg-white/10 p-1 flex items-center justify-center shrink-0 border border-white/20"
                     style="width: 36px; height: 36px;">
                    <img th:src="@{/img/logo.png}" 
                         alt="SR Kitchen" 
                         width="28" 
                         height="28" 
                         class="object-contain"
                         style="width: 28px; height: 28px; max-width: 28px; max-height: 28px;">
                </div>
                <div class="grid gap-0.5 whitespace-nowrap">
                    <strong class="text-base font-black font-jakarta tracking-tight text-white leading-none">SR Kitchen</strong>
                    <small class="text-[9px] font-bold tracking-widest uppercase text-sky-200 opacity-90 leading-none">Restaurant OS</small>
                </div>
            </a>

            <!-- Botón Toggle de contracción/expansión -->
            <button id="sidebar-toggle-btn"
                    type="button"
                    @click.stop.prevent="toggleSidebar()"
                    class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 text-white grid place-items-center transition cursor-pointer shrink-0 border border-white/10"
                    :class="sidebarOpen ? 'ml-1' : 'mx-auto'"
                    :title="sidebarOpen ? 'Contraer menú lateral' : 'Expandir menú lateral'">
                <i data-lucide="chevron-left" class="w-4 h-4 stroke-[2] transition-transform duration-200" :class="sidebarOpen ? '' : 'rotate-180'"></i>
            </button>
        </div>

        <!-- Navegación Principal -->
        <nav class="flex-1 flex flex-col gap-1 overflow-y-auto w-full pr-1" aria-label="Navegación principal">
            
            <!-- Sección Operación (Solo para personal del Restaurante: Admin local y Mesero) -->
            <div sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MESERO')" class="w-full flex flex-col gap-1">
                <div x-show="sidebarOpen" x-cloak class="px-3 pb-1.5 pt-1">
                    <span class="text-[10px] uppercase font-bold tracking-widest text-sky-200/70">Operación</span>
                </div>

                <!-- Inicio / Dashboard -->
                <a href="/home"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'home'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Inicio">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Inicio</span>
                </a>

                <!-- Mesas -->
                <a href="/mesa"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'mesas'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Mesas">
                    <i data-lucide="layout-grid" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Mesas</span>
                </a>

                <!-- Pedidos -->
                <a href="/pedidos"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'pedidos'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Pedidos">
                    <i data-lucide="shopping-bag" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Pedidos</span>
                </a>

                <!-- Facturas -->
                <a href="/factura"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'facturas'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Facturas">
                    <i data-lucide="receipt" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Facturas</span>
                </a>
            </div>

            <!-- Sección Administración (Solo Admin del Restaurante) -->
            <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="w-full">
                <div x-show="sidebarOpen" x-cloak class="px-3 pb-1.5 pt-3 border-t border-white/10 mt-2">
                    <span class="text-[10px] uppercase font-bold tracking-widest text-sky-200/70">Administración</span>
                </div>

                <!-- Platillos -->
                <a href="/platillos"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'platillos'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Platillos">
                    <i data-lucide="utensils" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Platillos</span>
                </a>

                <!-- Productos / Inventario -->
                <a href="/producto"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'productos'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Inventario">
                    <i data-lucide="boxes" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Inventario</span>
                </a>

                <!-- Meseros / Personal -->
                <a href="/mesero"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'meseros'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Personal y Meseros">
                    <i data-lucide="user-check" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Personal</span>
                </a>

                <!-- Datos / Optimización -->
                <a href="/datos"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'datos'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Analítica">
                    <i data-lucide="trending-up" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Optimización</span>
                </a>
            </div>

            <!-- Sección Super Admin (ÚNICAMENTE ROLE_CREATOR) -->
            <div sec:authorize="hasAuthority('ROLE_CREATOR')" class="w-full">
                <div x-show="sidebarOpen" x-cloak class="px-3 pb-1.5 pt-1">
                    <span class="text-[10px] uppercase font-bold tracking-widest text-amber-300">Super Admin</span>
                </div>

                <!-- Restaurantes -->
                <a href="/admin/restaurantes"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'restaurantes'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Gestión de Restaurantes">
                    <i data-lucide="store" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Restaurantes</span>
                </a>
            </div>

            <!-- Buzón / Foro (Solo Restaurantes) -->
            <div sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MESERO')" class="w-full mt-auto">
                <a href="/foro"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 group"
                   th:classappend="${activePage == 'foro'} ? 'bg-white/20 text-white font-bold shadow-xs' : 'text-sky-100 hover:bg-white/10 hover:text-white'"
                   title="Buzón / Foro">
                    <i data-lucide="message-square" class="w-5 h-5 shrink-0 stroke-[1.75]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Buzón / Foro</span>
                </a>
            </div>

        </nav>

        <!-- Cerrar Sesión inferior -->
        <div class="pt-3 border-t border-white/10 w-full">
            <form th:action="@{/logout}" method="post" class="w-full m-0">
                <button type="submit"
                        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold text-rose-200 hover:bg-rose-500/20 hover:text-rose-100 transition-colors cursor-pointer"
                        :class="sidebarOpen ? '' : 'justify-center'"
                        title="Cerrar Sesión">
                    <i data-lucide="log-out" class="w-4 h-4 shrink-0 stroke-[2]"></i>
                    <span x-show="sidebarOpen" x-cloak class="truncate">Cerrar Sesión</span>
                </button>
            </form>
        </div>

    </aside>

    <!-- ══════════════════════════════════════════════════════════
         2. SIDEBAR MÓVIL (Drawer con Overlay Backdrop)
         ══════════════════════════════════════════════════════════ -->
    <div x-show="mobileOpen"
         x-cloak
         class="fixed inset-0 z-50 md:hidden"
         aria-modal="true">
        
        <!-- Backdrop -->
        <div x-show="mobileOpen"
             x-transition:enter="transition-opacity ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs z-40"
             @click="mobileOpen = false"></div>

        <!-- Drawer Content con Ancho y Dimensiones Fijas Estrictas -->
        <div x-show="mobileOpen"
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="-translate-x-full"
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="translate-x-0"
             x-transition:leave-end="-translate-x-full"
             class="fixed top-0 bottom-0 left-0 w-64 max-w-[80vw] h-full bg-[#0c6780] text-white p-5 shadow-2xl z-50 flex flex-col justify-between overflow-y-auto"
             style="width: 270px; max-width: 80vw; background-color: #0c6780;">
            
            <div>
                <!-- Header Móvil con Botón Cerrar -->
                <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-4">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-lg bg-white/10 p-1 flex items-center justify-center shrink-0 border border-white/20"
                             style="width: 36px; height: 36px;">
                            <img th:src="@{/img/logo.png}" 
                                 alt="SR Kitchen" 
                                 width="28" 
                                 height="28" 
                                 class="object-contain"
                                 style="width: 28px; height: 28px; max-width: 28px; max-height: 28px;">
                        </div>
                        <span class="font-bold font-jakarta text-base text-white">SR Kitchen</span>
                    </div>
                    <button type="button" 
                            @click="mobileOpen = false" 
                            class="w-8 h-8 rounded-lg bg-white/10 text-white flex items-center justify-center hover:bg-white/20 cursor-pointer">
                        <i data-lucide="x" class="w-5 h-5 stroke-[2]"></i>
                    </button>
                </div>

                <!-- Links Móviles -->
                <nav class="space-y-1">
                    <div sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MESERO')" class="space-y-1">
                        <a href="/home" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'home'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="layout-dashboard" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Inicio</span>
                        </a>
                        <a href="/mesa" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'mesas'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="layout-grid" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Mesas</span>
                        </a>
                        <a href="/pedidos" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'pedidos'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="shopping-bag" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Pedidos</span>
                        </a>
                        <a href="/factura" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'facturas'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="receipt" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Facturas</span>
                        </a>
                    </div>

                    <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="pt-3 border-t border-white/10 space-y-1">
                        <a href="/platillos" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'platillos'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="utensils" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Platillos</span>
                        </a>
                        <a href="/producto" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'productos'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="boxes" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Inventario</span>
                        </a>
                        <a href="/mesero" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'meseros'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="user-check" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Personal</span>
                        </a>
                        <a href="/datos" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'datos'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="trending-up" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Optimización</span>
                        </a>
                    </div>

                    <div sec:authorize="hasAuthority('ROLE_CREATOR')" class="pt-3 border-t border-white/10 space-y-1">
                        <a href="/admin/restaurantes" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'restaurantes'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="store" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Restaurantes</span>
                        </a>
                    </div>

                    <div sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MESERO')">
                        <a href="/foro" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium"
                           th:classappend="${activePage == 'foro'} ? 'bg-white/20 text-white font-bold' : 'text-sky-100 hover:bg-white/10'">
                            <i data-lucide="message-square" class="w-5 h-5 stroke-[1.75]"></i>
                            <span>Buzón / Foro</span>
                        </a>
                    </div>
                </nav>
            </div>

            <!-- Logout Móvil -->
            <div class="pt-4 border-t border-white/10 mt-6">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-semibold text-rose-200 hover:bg-rose-500/20 cursor-pointer">
                        <i data-lucide="log-out" class="w-5 h-5 stroke-[2]"></i>
                        <span>Cerrar Sesión</span>
                    </button>
                </form>
            </div>

        </div>

    </div>

</th:block>
