<th:block th:fragment="chatbot" xmlns:th="http://www.thymeleaf.org">
    <div id="rskitchen-chatbot" 
         x-data="{
             isOpen: false,
             showBubble: true,
             messages: [
                 { sender: 'bot', text: '¡Hola! 👋 Soy tu asistente inteligente de **SR Kitchen**. ¿En qué puedo ayudarte hoy?' }
             ],
             inputText: '',
             loading: false,
             quickPrompts: [
                 '¿Qué mesas están disponibles?',
                 '¿Cuáles son los platillos más populares?',
                 '¿Cómo registrar un nuevo pedido?'
             ],
             toggleChat() {
                 this.isOpen = !this.isOpen;
                 if (this.isOpen) {
                     this.showBubble = false;
                     this.$nextTick(() => {
                         this.scrollToBottom();
                         this.$refs.chatInput?.focus();
                     });
                 }
             },
             scrollToBottom() {
                 const container = this.$refs.msgContainer;
                 if (container) { container.scrollTop = container.scrollHeight; }
             },
             sendQuick(prompt) {
                 this.inputText = prompt;
                 this.sendMessage();
             },
             async sendMessage() {
                 const text = this.inputText.trim();
                 if (!text || this.loading) return;
                 
                 this.messages.push({ sender: 'user', text });
                 this.inputText = '';
                 this.loading = true;
                 this.$nextTick(() => this.scrollToBottom());

                 try {
                     const csrfToken = document.querySelector('meta[name=_csrf]')?.getAttribute('content') || '';
                     const csrfHeader = document.querySelector('meta[name=_csrf_header]')?.getAttribute('content') || 'X-CSRF-TOKEN';
                     
                     const headers = { 'Content-Type': 'application/json' };
                     if (csrfToken) headers[csrfHeader] = csrfToken;

                     const response = await fetch('/api/chat', {
                         method: 'POST',
                         headers,
                         body: JSON.stringify({ message: text })
                     });

                     if (!response.ok) throw new Error('Error al conectar con el asistente');
                     
                     const data = await response.json();
                     const reply = data.response || data.mensaje || data.reply || 'No se recibió respuesta del modelo.';
                     this.messages.push({ sender: 'bot', text: reply });
                 } catch (err) {
                     this.messages.push({ sender: 'bot', text: '⚠️ Lo siento, ocurrió un error al consultar el asistente. Inténtalo nuevamente.' });
                 } finally {
                     this.loading = false;
                     this.$nextTick(() => this.scrollToBottom());
                 }
             }
         }"
         class="relative z-50">

        <!-- 1. Globo de bienvenida flotante previo -->
        <div x-show="!isOpen && showBubble"
             x-cloak
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-2 scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
             class="fixed bottom-24 right-6 sm:right-8 z-50 select-none cursor-pointer"
             @click="toggleChat()">
            <div class="bg-[#0c6780] hover:bg-[#095166] text-white text-xs font-semibold px-4 py-2 rounded-full shadow-xl flex items-center gap-2 border border-sky-400/30 hover:scale-105 transition-all">
                <span class="animate-bounce">🍳</span>
                <span>Asistente SR Kitchen</span>
            </div>
        </div>

        <!-- 2. Botón Circular Flotante (FAB) -->
        <button type="button"
                id="btn-rskitchen-chat"
                @click="toggleChat()"
                class="fixed bottom-6 right-6 sm:right-8 w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-[#0c6780] hover:bg-[#095166] text-white shadow-2xl ring-4 ring-sky-300/40 flex items-center justify-center transition-all duration-300 transform hover:scale-105 active:scale-95 z-50 cursor-pointer"
                style="background-color: #0c6780;"
                aria-label="Abrir asistente de SR Kitchen">
            <template x-if="!isOpen">
                <i data-lucide="bot" class="w-7 h-7 stroke-[2]"></i>
            </template>
            <template x-if="isOpen">
                <i data-lucide="x" class="w-7 h-7 stroke-[2]"></i>
            </template>
        </button>

        <!-- 3. Ventana Emergente del Chatbot -->
        <div x-show="isOpen"
             x-cloak
             x-transition:enter="transition ease-out duration-250 transform"
             x-transition:enter-start="opacity-0 translate-y-6 scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 translate-y-6 scale-95"
             class="fixed bottom-24 right-4 sm:right-8 w-[calc(100vw-2rem)] sm:w-[420px] h-[560px] max-h-[80vh] bg-white rounded-xl border border-slate-200 shadow-2xl flex flex-col overflow-hidden z-50">
            
            <!-- Header -->
            <div class="p-4 bg-gradient-to-r from-[#0c6780] to-[#095166] text-white flex items-center justify-between shadow-xs">
                <div class="flex items-center gap-3">
                    <div class="size-10 rounded-2xl bg-white/15 p-2 flex items-center justify-center border border-white/20">
                        <i data-lucide="sparkles" class="size-5 stroke-[2] text-amber-300"></i>
                    </div>
                    <div>
                        <h3 class="font-bold font-jakarta text-sm leading-tight text-white">Chef Asistente IA</h3>
                        <span class="text-[10px] text-sky-200 flex items-center gap-1 font-medium">
                            <span class="size-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            Conectado con Groq LLaMA
                        </span>
                    </div>
                </div>
                <button type="button" @click="toggleChat()" class="size-8 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors">
                    <i data-lucide="x" class="size-4.5 stroke-[2]"></i>
                </button>
            </div>

            <!-- Contenedor de Mensajes -->
            <div class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/70" x-ref="msgContainer">
                <template x-for="(msg, index) in messages" :key="index">
                    <div class="flex flex-col" :class="msg.sender === 'user' ? 'items-end' : 'items-start'">
                        <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-xs sm:text-sm leading-relaxed"
                             :class="msg.sender === 'user' 
                                 ? 'bg-[#0c6780] text-white rounded-tr-none shadow-xs' 
                                 : 'bg-white text-slate-800 border border-slate-200/80 rounded-tl-none shadow-xs'">
                            <span class="whitespace-pre-wrap" x-text="msg.text"></span>
                        </div>
                    </div>
                </template>

                <!-- Indicador de tipeo animado -->
                <div x-show="loading" class="flex items-center gap-1.5 p-3 rounded-2xl bg-white border border-slate-200 w-fit text-slate-400">
                    <span class="size-2 rounded-full bg-[#0c6780] animate-bounce"></span>
                    <span class="size-2 rounded-full bg-[#0c6780] animate-bounce" style="animation-delay: 0.15s"></span>
                    <span class="size-2 rounded-full bg-[#0c6780] animate-bounce" style="animation-delay: 0.3s"></span>
                </div>
            </div>

            <!-- Preguntas rápidas -->
            <div class="px-4 py-2 bg-white border-t border-slate-100 flex gap-1.5 overflow-x-auto select-none no-scrollbar">
                <template x-for="(prompt, i) in quickPrompts" :key="i">
                    <button type="button"
                            @click="sendQuick(prompt)"
                            class="whitespace-nowrap px-3 py-1 rounded-full text-[11px] font-medium bg-slate-100 hover:bg-[#0c6780]/10 hover:text-[#0c6780] text-slate-600 transition-colors shrink-0">
                        <span x-text="prompt"></span>
                    </button>
                </template>
            </div>

            <!-- Input Area -->
            <form @submit.prevent="sendMessage()" class="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
                <input type="text"
                       x-ref="chatInput"
                       x-model="inputText"
                       placeholder="Haz una pregunta sobre el restaurante..."
                       class="flex-1 px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#0c6780]/30 focus:border-[#0c6780] transition-all" />
                <button type="submit"
                        :disabled="loading || !inputText.trim()"
                        class="size-10 rounded-xl bg-[#0c6780] hover:bg-[#095166] text-white flex items-center justify-center transition-colors disabled:opacity-40 disabled:cursor-not-allowed shrink-0">
                    <i data-lucide="send" class="size-4 stroke-[2]"></i>
                </button>
            </form>

        </div>

    </div>
</th:block>
