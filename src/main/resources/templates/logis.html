<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | SR Kitchen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="bg-gradient-to-br from-primary via-bg-light to-accent min-h-screen flex items-center justify-center p-4">

    <!-- Animated Background Elements -->
    <div class="fixed inset-0 overflow-hidden z-0">
        <div class="absolute top-10 left-10 w-40 h-40 bg-accent/20 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-10 right-10 w-40 h-40 bg-accent/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 w-40 h-40 bg-primary/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 4s;"></div>
    </div>

    <!-- Back Button -->
    <a th:href="@{/}" class="absolute top-6 left-6 glass rounded-lg px-4 py-2 flex items-center space-x-2 hover:shadow-elevation transition-all duration-200 z-10">
        <span class="material-symbols-outlined text-primary">arrow_back</span>
        <span class="font-jakarta font-semibold text-primary hidden sm:inline">Volver</span>
    </a>

    <!-- Login Container -->
    <div class="relative z-10 w-full max-w-md">
        <!-- Card -->
        <div class="glass rounded-3xl p-8 sm:p-12 shadow-elevation">
            <!-- Logo and Title -->
            <div class="text-center mb-8">
                <img th:src="@{/img/logo.png}" alt="SR Kitchen" class="mx-auto h-24 w-auto mb-4">
                <h1 class="text-3xl font-jakarta font-bold text-primary mb-2">SR Kitchen</h1>
                <p class="text-gray-600 font-work">Gestión inteligente de restaurantes</p>
            </div>

            <!-- Login Form -->
            <form action="/login" method="POST" class="space-y-5">
                <!-- Username Field -->
                <div>
                    <label class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                        <span class="material-symbols-outlined inline-block mr-2 text-base">mail</span>
                        Email
                    </label>
                    <input type="text" name="username" required
                           class="input-focus w-full pl-4" 
                           placeholder="tu@email.com">
                </div>

                <!-- Password Field -->
                <div>
                    <label class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                        <span class="material-symbols-outlined inline-block mr-2 text-base">lock</span>
                        Contraseña
                    </label>
                    <input type="password" name="password" required
                           class="input-focus w-full pl-4" 
                           placeholder="••••••••">
                </div>

                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Login Button -->
                <button type="submit" class="btn-primary w-full py-3 text-lg mt-6">
                    <span class="material-symbols-outlined inline-block mr-2">login</span>
                    Iniciar Sesión
                </button>
            </form>

            <!-- Error Message -->
            <div th:if="${param.error}" class="mt-6 p-4 bg-red-50 border-2 border-red-200 rounded-lg flex items-start space-x-3">
                <span class="material-symbols-outlined text-red-600 text-2xl flex-shrink-0">error</span>
                <div>
                    <p class="font-jakarta font-semibold text-red-900">Autenticación Fallida</p>
                    <p class="text-red-700 text-sm font-work mt-1">Usuario o contraseña incorrectos. Por favor, intenta nuevamente.</p>
                </div>
            </div>

            <!-- Footer Info -->
            <div class="mt-8 pt-6 border-t border-gray-200 text-center text-sm text-gray-600 font-work">
    </div>
</body>
</html>
