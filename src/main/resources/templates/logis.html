<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión – SR Kitchen</title>
    
    <!-- Tipografía: Plus Jakarta Sans & Work Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Compilado Localmente -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">

    <!-- Lucide Icons & Alpine.js -->
    <script th:src="@{/js/lucide.min.js}"></script>
    <script defer th:src="@{/js/alpine.min.js}"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>

<body class="bg-gradient-to-br from-[#0c6780] via-[#095166] to-slate-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-work selection:bg-[#0c6780] selection:text-white">

    <!-- Patrón y resplandores de fondo -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-sky-400/15 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-[#0c6780]/30 rounded-full blur-3xl"></div>
    </div>

    <!-- Botón Volver a Landing -->
    <a th:href="@{/landing}" 
       class="absolute top-6 left-6 inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-white backdrop-blur-md border border-white/20 text-xs font-bold transition-all z-20 cursor-pointer shadow-sm">
        <i data-lucide="arrow-left" class="w-4 h-4 text-white"></i>
        <span>Volver a Inicio</span>
    </a>

    <!-- Tarjeta Central de Autenticación -->
    <div class="relative z-10 w-full max-w-md my-8">
        
        <div class="bg-white rounded-xl p-8 sm:p-10 shadow-2xl border border-slate-200">
            
            <!-- Logo y Cabecera de la Marca -->
            <div class="text-center mb-7">
                <div class="w-14 h-14 rounded-xl bg-sky-50 border border-sky-100 p-2 mx-auto mb-3 flex items-center justify-center shadow-xs"
                     style="width: 56px; height: 56px;">
                    <img th:src="@{/img/logo.png}" 
                         alt="SR Kitchen Logo" 
                         width="48" 
                         height="48" 
                         class="object-contain"
                         style="width: 48px; height: 48px; max-width: 48px; max-height: 48px;">
                </div>
                <h1 class="text-2xl font-black font-jakarta text-slate-900 tracking-tight">SR Kitchen</h1>
                <p class="text-xs text-slate-500 mt-1 font-medium">Sistema Operativo de Restaurante &bull; Acceso Seguro</p>
            </div>

            <!-- Alerta de Error de Autenticación -->
            <div th:if="${param.error}" class="mb-5 p-3.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold flex items-center gap-2.5 shadow-xs">
                <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600 shrink-0"></i>
                <div>
                    <strong class="block">Credenciales inválidas</strong>
                    <span class="text-rose-700 font-normal">Revisa tu correo o contraseña e intenta de nuevo.</span>
                </div>
            </div>

            <!-- Formulario de Login -->
            <form th:action="@{/login}" method="POST" class="space-y-4">
                
                <!-- Correo Electrónico -->
                <div>
                    <label class="block text-xs font-bold text-slate-800 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="mail" class="w-3.5 h-3.5 text-slate-400"></i>
                        <span>Correo Electrónico</span>
                    </label>
                    <input type="email" 
                           name="username" 
                           required
                           autocomplete="username"
                           placeholder="tu@rskitchen.com"
                           class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0c6780]/30 focus:border-[#0c6780] transition-all">
                </div>

                <!-- Contraseña -->
                <div>
                    <label class="block text-xs font-bold text-slate-800 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="lock" class="w-3.5 h-3.5 text-slate-400"></i>
                        <span>Contraseña</span>
                    </label>
                    <input type="password" 
                           name="password" 
                           required
                           autocomplete="current-password"
                           placeholder="••••••••"
                           class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0c6780]/30 focus:border-[#0c6780] transition-all">
                </div>

                <!-- Token CSRF Spring Security -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Botón de Envío de Alto Contraste -->
                <button type="submit" 
                        class="w-full py-3 px-5 rounded-lg bg-[#0c6780] hover:bg-[#095166] text-white font-bold text-sm shadow-md transition-all cursor-pointer flex items-center justify-center gap-2 mt-4"
                        style="background-color: #0c6780; color: #ffffff;">
                    <i data-lucide="log-in" class="w-4 h-4 stroke-[2] text-white"></i>
                    <span class="text-white font-bold">Ingresar al Sistema</span>
                </button>

            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center">
                <p class="text-[11px] text-slate-400">
                    Acceso protegido para personal autorizado del restaurante.
                </p>
            </div>

        </div>

        <p class="text-center text-xs text-sky-200/70 mt-4 font-normal">
            &copy; 2026 SR Kitchen Restaurant OS &bull; Todos los derechos reservados.
        </p>

    </div>

    <!-- Inicialización de Iconos Lucide -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        });
    </script>

</body>
</html>
