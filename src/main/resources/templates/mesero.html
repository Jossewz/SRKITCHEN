<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Meseros | SR Kitchen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="lg:ml-64 transition-all duration-300">

    <!-- Sidebar Navigation -->
    <div th:replace="fragments/layout :: sidebar"></div>
    
    <!-- Mobile Menu Toggle -->
    <div th:replace="fragments/layout :: mobile-menu-toggle"></div>
    
    <!-- Top Header -->
    <div th:replace="fragments/layout :: header"></div>

    <!-- Main Content -->
    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-7xl mx-auto">
        
        <!-- Flash Messages -->
        <div th:replace="fragments/components :: messages"></div>

        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-4xl font-jakarta font-bold text-primary mb-2">Gestión de Meseros</h1>
                    <p class="text-gray-600 font-work">Administra el personal del restaurante</p>
                </div>
                <button onclick="openModal('createMeseroModal')" class="btn-primary">
                    <span class="material-symbols-outlined inline-block mr-2">person_add</span>
                    Nuevo Mesero
                </button>
            </div>
        </div>

        <!-- Create Mesero Modal -->
        <div id="createMeseroModal" data-modal-id="createMeseroModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" data-modal-overlay>
            <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-elevation">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-jakarta font-bold text-primary">Registrar Mesero</h2>
                    <button onclick="closeModal('createMeseroModal')" class="p-2 hover:bg-bg-light rounded-lg transition-all" data-modal-close>
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <form th:action="@{/mesero/guardar}" method="post" th:object="${mesero}" class="space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div>
                        <label for="idMesero" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                            ID del Mesero
                        </label>
                        <input type="text" id="idMesero" th:field="*{id_mesero}" required
                               class="input-focus w-full" placeholder="Ej: MES001">
                    </div>

                    <div>
                        <label for="nombreMesero" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                            Nombre Completo
                        </label>
                        <input type="text" id="nombreMesero" th:field="*{name}" required
                               class="input-focus w-full" placeholder="Ej: Juan Pérez">
                    </div>

                    <div>
                        <label for="mailMesero" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                            Correo Electrónico
                        </label>
                        <input type="email" id="mailMesero" th:field="*{mail}" required
                               class="input-focus w-full" placeholder="Ej: juan@example.com">
                    </div>

                    <div>
                        <label for="passwordMesero" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                            Contraseña
                        </label>
                        <input type="password" id="passwordMesero" th:field="*{password}" required
                               class="input-focus w-full" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn-primary w-full">
                        <span class="material-symbols-outlined inline-block mr-2">check</span>
                        Registrar Mesero
                    </button>
                </form>
            </div>
        </div>

        <!-- Meseros Table -->
        <div class="card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-primary text-white">
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">
                                <span class="material-symbols-outlined inline-block mr-2 text-base">badge</span>
                                ID
                            </th>
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">
                                <span class="material-symbols-outlined inline-block mr-2 text-base">person</span>
                                Nombre
                            </th>
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">
                                <span class="material-symbols-outlined inline-block mr-2 text-base">mail</span>
                                Correo
                            </th>
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">
                                <span class="material-symbols-outlined inline-block mr-2 text-base">security</span>
                                Rol
                            </th>
                            <th class="px-6 py-4 text-center font-jakarta font-semibold">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr th:each="m : ${meseros}" class="hover:bg-bg-light transition-colors">
                            <td class="px-6 py-4 font-jakarta font-semibold text-primary" th:text="${m.id_mesero}"></td>
                            <td class="px-6 py-4 font-work text-gray-700" th:text="${m.name}"></td>
                            <td class="px-6 py-4 font-work text-gray-600 text-sm" th:text="${m.mail}"></td>
                            <td class="px-6 py-4">
                                <span class="chip-info text-sm">
                                    <span class="material-symbols-outlined text-xs mr-1">badge</span>
                                    <span th:text="${m.role}"></span>
                                </span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <button class="btn-secondary text-sm py-2 px-3">
                                    <span class="material-symbols-outlined inline-block text-base">edit</span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div th:if="${meseros == null or meseros.isEmpty()}" class="text-center py-16 px-6">
                <span class="material-symbols-outlined text-6xl text-gray-300 mb-4 block">person</span>
                <h3 class="font-jakarta font-bold text-gray-400 text-lg mb-2">No hay meseros registrados</h3>
                <p class="text-gray-500 font-work mb-4">Registra tu primer mesero para comenzar</p>
                <button onclick="openModal('createMeseroModal')" class="btn-primary">
                    <span class="material-symbols-outlined inline-block mr-2">person_add</span>
                    Registrar Mesero
                </button>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <div th:replace="fragments/components :: footer"></div>

    <!-- Scripts -->
    <script th:src="@{/js/mobile-menu.js}"></script>
    <script th:src="@{/js/ui-helpers.js}"></script>

</body>
</html>
