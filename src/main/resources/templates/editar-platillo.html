<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/base :: html(~{::content}, 'platillos', 'Editar Platillo')}">

<head>
    <title>Editar Platillo – SR Kitchen</title>
</head>

<body>

<th:block th:fragment="content">
    
    <div class="max-w-xl mx-auto space-y-6">

        <div class="flex items-center justify-between pb-2 border-b border-slate-200/80">
            <div>
                <h1 class="text-2xl font-extrabold font-jakarta text-slate-800 tracking-tight">Editar Platillo</h1>
                <p class="text-xs text-slate-500">Actualiza el nombre, raciones disponibles y precio de venta</p>
            </div>
            
            <a href="/platillos"
               class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs shadow-xs transition-colors cursor-pointer">
                <i data-lucide="arrow-left" class="size-4"></i>
                <span>Volver a Platillos</span>
            </a>
        </div>

        <div class="bg-white rounded-xl border border-slate-200/90 p-6 sm:p-8 shadow-sm">
            <form th:action="@{'/platillos/editar/' + ${platillo.id}}" th:object="${platillo}" method="post" class="space-y-5">
                
                <div>
                    <label for="platilloNombre" class="block text-xs font-bold text-slate-700 mb-1.5">
                        Nombre del Platillo <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" 
                           id="platilloNombre" 
                           th:field="*{name}" 
                           required
                           class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0c6780]/30 focus:border-[#0c6780] transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="platilloCantidad" class="block text-xs font-bold text-slate-700 mb-1.5">
                            Stock / Raciones <span class="text-rose-500">*</span>
                        </label>
                        <input type="number" 
                               id="platilloCantidad" 
                               th:field="*{cant}" 
                               required
                               min="0"
                               class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0c6780]/30 focus:border-[#0c6780] transition-all">
                    </div>

                    <div>
                        <label for="platilloPrecio" class="block text-xs font-bold text-slate-700 mb-1.5">
                            Precio de Venta ($) <span class="text-rose-500">*</span>
                        </label>
                        <input type="number" 
                               id="platilloPrecio" 
                               th:field="*{price}" 
                               required
                               step="0.01" 
                               min="0"
                               class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0c6780]/30 focus:border-[#0c6780] transition-all">
                    </div>
                </div>

                <div class="flex items-center gap-3 pt-3 border-t border-slate-100">
                    <button type="submit" 
                            class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-[#0c6780] hover:bg-[#095166] text-white font-bold text-xs shadow-xs transition-colors cursor-pointer">
                        <i data-lucide="check" class="size-4"></i>
                        <span>Guardar Cambios</span>
                    </button>
                    <a href="/platillos" 
                       class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs transition-colors cursor-pointer">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>

    </div>

</th:block>

</body>
</html>
