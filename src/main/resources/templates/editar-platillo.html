<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Platillo | SR Kitchen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="lg:ml-64 transition-all duration-300">

    <!-- Sidebar Navigation -->
    <div th:replace="fragments/layout :: sidebar"></div>
    
    <!-- Mobile Menu Toggle -->
    <div th:replace="fragments/layout :: mobile-menu-toggle"></div>
    
    <!-- Top Header -->
    <div th:replace="fragments/layout :: header"></div>

    <!-- Main Content -->
    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-2xl mx-auto">
        
        <!-- Flash Messages -->
        <div th:replace="fragments/components :: messages"></div>

        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-4xl font-jakarta font-bold text-primary mb-2">Editar Platillo</h1>
                    <p class="text-gray-600 font-work">Actualiza la información del platillo</p>
                </div>
                <a href="/platillos" class="p-2 hover:bg-bg-light rounded-lg transition-all">
                    <span class="material-symbols-outlined text-primary">arrow_back</span>
                </a>
            </div>
        </div>

        <!-- Edit Form Card -->
        <div class="card p-8 mb-8">
            <form th:action="@{/platillos/editar/{id}(id=${platillo.id})}" th:object="${platillo}" method="post" class="space-y-6">
                
                <div>
                    <label for="platilloNombre" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                        Nombre del Platillo
                    </label>
                    <input type="text" id="platilloNombre" th:field="*{name}" required
                           class="input-focus w-full" placeholder="Nombre del platillo">
                </div>

                <div>
                    <label for="platilloCantidad" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                        Cantidad Disponible
                    </label>
                    <input type="text" id="platilloCantidad" th:field="*{cant}" required
                           class="input-focus w-full" placeholder="Cantidad disponible">
                </div>

                <div>
                    <label for="platilloPrecio" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                        Precio ($)
                    </label>
                    <input type="number" id="platilloPrecio" th:field="*{price}" required
                           step="0.01" min="0" class="input-focus w-full" placeholder="0.00">
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 btn-primary py-3">
                        <span class="material-symbols-outlined inline-block mr-2">check</span>
                        Guardar Cambios
                    </button>
                    <a href="/platillos" class="flex-1 btn-secondary py-3 text-center">
                        <span class="material-symbols-outlined inline-block mr-2">close</span>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="fragments/components :: footer"></div>

    <!-- Scripts -->
    <script th:src="@{/js/mobile-menu.js}"></script>
    <script th:src="@{/js/ui-helpers.js}"></script>

</body>
</html>
