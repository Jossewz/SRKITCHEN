<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas | SR Kitchen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="lg:ml-64 transition-all duration-300">

    <!-- Sidebar Navigation -->
    <div th:replace="fragments/layout :: sidebar"></div>
    
    <!-- Mobile Menu Toggle -->
    <div th:replace="fragments/layout :: mobile-menu-toggle"></div>
    
    <!-- Top Header -->
    <div th:replace="fragments/layout :: header"></div>

    <!-- Main Content -->
    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-7xl mx-auto">
        
        <!-- Flash Messages -->
        <div th:replace="fragments/components :: messages"></div>

        <!-- Page Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-jakarta font-bold text-primary mb-2">Listado de Facturas</h1>
            <p class="text-gray-600 font-work">Gestiona y visualiza todas las facturas generadas</p>
        </div>

        <!-- Facturas Table -->
        <div class="card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-primary text-white">
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">
                                <span class="material-symbols-outlined inline-block mr-2 text-base">table_restaurant</span>
                                Mesa
                            </th>
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">
                                <span class="material-symbols-outlined inline-block mr-2 text-base">person</span>
                                Mesero
                            </th>
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">
                                <span class="material-symbols-outlined inline-block mr-2 text-base">schedule</span>
                                Fecha
                            </th>
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">
                                <span class="material-symbols-outlined inline-block mr-2 text-base">attach_money</span>
                                Total
                            </th>
                            <th class="px-6 py-4 text-left font-jakarta font-semibold">Estado</th>
                            <th class="px-6 py-4 text-center font-jakarta font-semibold">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr th:each="f : ${facturas}" class="hover:bg-bg-light transition-colors">
                            <td class="px-6 py-4 font-jakarta font-semibold text-primary" th:text="${'Mesa ' + f.mesaNum}"></td>
                            <td class="px-6 py-4 font-work text-gray-700" th:text="${f.meseroName}"></td>
                            <td class="px-6 py-4 font-work text-gray-600 text-sm" th:text="${#temporals.format(f.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="px-6 py-4 font-jakarta font-bold text-primary" th:text="${'$' + #numbers.formatDecimal(f.total, 1, 2)}"></td>
                            <td class="px-6 py-4">
                                <span th:if="${f.estado.name() == 'PENDIENTE'}" class="chip-warning">
                                    <span class="material-symbols-outlined text-xs mr-1">schedule</span>
                                    Pendiente
                                </span>
                                <span th:if="${f.estado.name() == 'APROBADA'}" class="chip-success">
                                    <span class="material-symbols-outlined text-xs mr-1">check_circle</span>
                                    Pagada
                                </span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <button type="button" class="btn-secondary text-sm py-2 px-3"
                                        onclick="openDetailModal(this)"
                                        th:data-id="${f.id}"
                                        th:data-url="@{/factura/detalle/}">
                                    <span class="material-symbols-outlined inline-block text-base">visibility</span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-between mt-8">
            <div class="text-sm text-gray-600 font-work">
                Página <span class="font-jakarta font-bold text-primary" th:text="${currentPage + 1}"></span> de 
                <span class="font-jakarta font-bold text-primary" th:text="${totalPages}"></span>
            </div>
            
            <div class="flex gap-2">
                <a th:if="${currentPage > 0}"
                   th:href="@{'/factura?page=' + ${currentPage - 1}}"
                   class="btn-secondary px-4 py-2 text-sm">
                    <span class="material-symbols-outlined inline-block mr-1">arrow_back</span>
                    Anterior
                </a>
                
                <a th:if="${currentPage + 1 < totalPages}"
                   th:href="@{'/factura?page=' + ${currentPage + 1}}"
                   class="btn-primary px-4 py-2 text-sm">
                    Siguiente
                    <span class="material-symbols-outlined inline-block ml-1">arrow_forward</span>
                </a>
            </div>
        </div>

    </main>

    <!-- Detail Modal -->
    <div id="facturaDetailModal" data-modal-id="facturaDetailModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto" data-modal-overlay>
        <div class="bg-white rounded-2xl max-w-2xl w-full p-8 shadow-elevation my-8">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-jakarta font-bold text-primary">Detalle de Factura</h2>
                <button onclick="closeModal('facturaDetailModal')" class="p-2 hover:bg-bg-light rounded-lg transition-all" data-modal-close>
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="detalleFacturaContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="fragments/components :: footer"></div>

    <!-- Scripts -->
    <script th:src="@{/js/mobile-menu.js}"></script>
    <script th:src="@{/js/ui-helpers.js}"></script>
    <script th:src="@{/js/factura-table.js}"></script>

</body>
</html>

</body>
</html>
