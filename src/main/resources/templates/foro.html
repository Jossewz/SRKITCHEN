<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón y Foro de Sugerencias | SR Kitchen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="lg:ml-64 transition-all duration-300 bg-gray-50 font-work">

    <!-- Sidebar Navigation -->
    <div th:replace="fragments/layout :: sidebar"></div>
    
    <!-- Mobile Menu Toggle -->
    <div th:replace="fragments/layout :: mobile-menu-toggle"></div>
    
    <!-- Top Header -->
    <div th:replace="fragments/layout :: header"></div>

    <!-- Main Content -->
    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-5xl mx-auto">
        
        <!-- Flash Messages -->
        <div th:replace="fragments/components :: messages"></div>

        <div th:if="${message}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 flex items-center">
            <span class="material-symbols-outlined mr-2">check_circle</span>
            <span th:text="${message}"></span>
        </div>

        <!-- Page Header -->
        <div class="mb-8">
            <h1 class="text-3xl lg:text-4xl font-jakarta font-bold text-gray-900 mb-2">Buzón de Sugerencias y Foro</h1>
            <p class="text-gray-500 font-work">Espacio colaborativo de feedback y comunicación del restaurante</p>
        </div>

        <!-- Formulario Nuevo Comentario -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 mb-10">
            <h2 class="text-xl font-bold font-jakarta text-gray-900 mb-4 flex items-center">
                <span class="material-symbols-outlined text-orange-600 mr-2">rate_review</span>
                Dejar un Comentario o Sugerencia
            </h2>
            
            <form th:action="@{/foro}" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tu Nombre</label>
                    <input type="text" name="Fnombre" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none" placeholder="Ingresa tu nombre..." />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Comentario o Sugerencia</label>
                    <textarea name="Fcomentario" rows="4" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none" placeholder="Describe tu mensaje, propuesta o novedad..."></textarea>
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="px-6 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-semibold shadow-md transition-colors inline-flex items-center">
                        <span class="material-symbols-outlined mr-2 text-sm">send</span>
                        Publicar Comentario
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de Comentarios -->
        <div>
            <h2 class="text-2xl font-bold font-jakarta text-gray-900 mb-6 flex items-center">
                <span class="material-symbols-outlined text-gray-700 mr-2">forum</span>
                Mensajes Recientes
            </h2>

            <div th:if="${foros.empty}" class="bg-white rounded-2xl p-12 text-center text-gray-400 border border-gray-100">
                <span class="material-symbols-outlined text-5xl mb-2 text-gray-300">chat_bubble_outline</span>
                <p class="text-lg font-medium">Aún no hay comentarios en el foro</p>
                <p class="text-sm">¡Sé el primero en compartir tu opinión!</p>
            </div>

            <div class="space-y-4" th:unless="${foros.empty}">
                <div th:each="f : ${foros}" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition-shadow">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-orange-100 text-orange-700 flex items-center justify-center font-bold text-sm">
                                <span th:text="${#strings.substring(f.fnombre, 0, 1)}">U</span>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900" th:text="${f.fnombre}"></h3>
                                <span class="text-xs text-gray-400" th:if="${f.fecha != null}" th:text="${#dates.format(f.fecha, 'dd/MM/yyyy HH:mm')}"></span>
                            </div>
                        </div>
                    </div>
                    <p class="text-gray-700 leading-relaxed pl-13" th:text="${f.fcomentario}"></p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="fragments/components :: footer"></div>

</body>
</html>
