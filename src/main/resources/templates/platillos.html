<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Platillos | SR Kitchen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="lg:ml-64 transition-all duration-300">

    <!-- Sidebar Navigation -->
    <div th:replace="fragments/layout :: sidebar"></div>
    
    <!-- Mobile Menu Toggle -->
    <div th:replace="fragments/layout :: mobile-menu-toggle"></div>
    
    <!-- Top Header -->
    <div th:replace="fragments/layout :: header"></div>

    <!-- Main Content -->
    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-7xl mx-auto">
        
        <!-- Flash Messages -->
        <div th:replace="fragments/components :: messages"></div>

        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-4xl font-jakarta font-bold text-primary mb-2">Gestión de Platillos</h1>
                    <p class="text-gray-600 font-work">Administra el menú de tu restaurante</p>
                </div>
                <button onclick="openModal('createPlatilloModal')" class="btn-primary">
                    <span class="material-symbols-outlined inline-block mr-2">add</span>
                    Nuevo Platillo
                </button>
            </div>

            <!-- Search Bar -->
            <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-3 text-gray-400">search</span>
                <input type="text" id="searchPlatillos" placeholder="Buscar platillo por nombre..."
                       class="w-full pl-12 pr-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
        </div>

        <!-- Create Platillo Modal -->
        <div id="createPlatilloModal" data-modal-id="createPlatilloModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" data-modal-overlay>
            <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-elevation">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-jakarta font-bold text-primary">Nuevo Platillo</h2>
                    <button onclick="closeModal('createPlatilloModal')" class="p-2 hover:bg-bg-light rounded-lg transition-all" data-modal-close>
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <form th:action="@{/platillos/guardar}" method="post" th:object="${platilloNuevo}" class="space-y-4">
                    <div>
                        <label for="platilloNombre" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                            Nombre del Platillo
                        </label>
                        <input type="text" id="platilloNombre" th:field="*{name}" required
                               class="input-focus w-full" placeholder="Ej: Ceviche">
                    </div>

                    <div>
                        <label for="platilloCantidad" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                            Cantidad
                        </label>
                        <input type="text" id="platilloCantidad" th:field="*{cant}" required
                               class="input-focus w-full" placeholder="Ej: 10 porciones">
                    </div>

                    <div>
                        <label for="platilloPrecio" class="block text-sm font-jakarta font-semibold text-gray-700 mb-2">
                            Precio ($)
                        </label>
                        <input type="number" id="platilloPrecio" th:field="*{price}" required
                               step="0.01" min="0" class="input-focus w-full" placeholder="0.00">
                    </div>

                    <button type="submit" class="btn-primary w-full">
                        <span class="material-symbols-outlined inline-block mr-2">check</span>
                        Guardar Platillo
                    </button>
                </form>
            </div>
        </div>

        <!-- Platillos Grid -->
        <div th:if="${platillos != null and !platillos.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="platillosGrid">
            
            <div th:each="platillo : ${platillos}" class="bg-white rounded-xl border border-gray-200 shadow-md transition-all duration-300 hover:shadow-xl hover:scale-105 p-6 cursor-pointer group" data-platillo-name="${platillo.name}">
                
                <!-- Header with Icon -->
                <div class="flex items-start justify-between mb-4">
                    <div class="flex-1">
                        <h3 class="text-2xl font-jakarta font-bold text-primary line-clamp-2 group-hover:text-accent transition-colors" 
                            th:text="${platillo.name}"></h3>
                        <p class="text-sm text-gray-600 font-work mt-1">ID: <span th:text="${platillo.id != null and platillo.id.length() >= 8 ? platillo.id.substring(0,8) : platillo.id}"></span></p>
                    </div>
                    <span class="material-symbols-outlined text-5xl text-accent/20 group-hover:text-accent/40 transition-colors">restaurant_menu</span>
                </div>

                <!-- Stock Status -->
                <div class="mb-4 pb-4 border-b border-gray-100">
                    <p class="text-xs text-gray-600 font-work mb-1">DISPONIBILIDAD</p>
                    <div class="flex items-center justify-between">
                        <p class="font-jakarta font-bold text-gray-800" th:text="${platillo.cant}"></p>
                        <span th:if="${platillo.cant > 5}" class="chip-success text-xs">
                            <span class="material-symbols-outlined text-xs mr-1">check_circle</span>
                            En Stock
                        </span>
                        <span th:if="${platillo.cant <= 5 and platillo.cant > 0}" class="chip-warning text-xs">
                            <span class="material-symbols-outlined text-xs mr-1">warning</span>
                            Bajo Stock
                        </span>
                        <span th:if="${platillo.cant <= 0}" class="chip-danger text-xs">
                            <span class="material-symbols-outlined text-xs mr-1">error</span>
                            Agotado
                        </span>
                    </div>
                </div>

                <!-- Price -->
                <div class="mb-6">
                    <p class="text-xs text-gray-600 font-work mb-2">PRECIO UNITARIO</p>
                    <p class="text-3xl font-jakarta font-bold text-primary" th:text="${'$' + #numbers.formatDecimal(platillo.price, 1, 2)}"></p>
                </div>

                <!-- Actions -->
                <div class="flex gap-2">
                    <a th:href="@{/platillos/editar/{id}(id=${platillo.id})}" class="flex-1 btn-secondary text-center py-2 text-sm">
                        <span class="material-symbols-outlined inline-block mr-1">edit</span>
                        Editar
                    </a>
                    <form th:action="@{/platillos/eliminar/{id}(id=${platillo.id})}" method="post" class="flex-1">
                        <button type="submit" class="w-full btn-danger text-sm py-2"
                                onclick="return confirm('¿Eliminar este platillo?');">
                            <span class="material-symbols-outlined inline-block mr-1">delete</span>
                            Eliminar
                        </button>
                    </form>
                </div>

            </div>

        </div>

        <!-- Empty State -->
        <div th:if="${platillos == null or platillos.isEmpty()}" class="text-center py-16">
            <span class="material-symbols-outlined text-7xl text-gray-300 mb-4 block">restaurant_menu</span>
            <h3 class="text-xl font-jakarta font-bold text-gray-400 mb-2">No hay platillos</h3>
            <p class="text-gray-500 font-work mb-4">Crea tu primer platillo para comenzar</p>
            <button onclick="openModal('createPlatilloModal')" class="btn-primary">
                <span class="material-symbols-outlined inline-block mr-2">add</span>
                Crear Platillo
            </button>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="fragments/components :: footer"></div>

    <!-- Scripts -->
    <script th:src="@{/js/mobile-menu.js}"></script>
    <script th:src="@{/js/ui-helpers.js}"></script>
    <script th:src="@{/js/platillos-table.js}"></script>

</body>
</html>
