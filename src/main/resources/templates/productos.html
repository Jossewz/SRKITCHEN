<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Productos | SR Kitchen</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Global Styles -->
    <link rel="stylesheet" th:href="@{/css/globals.css}">
</head>
<body class="lg:ml-64 transition-all duration-300 bg-gray-50 font-work">

    <!-- Sidebar Navigation -->
    <div th:replace="fragments/layout :: sidebar"></div>
    
    <!-- Mobile Menu Toggle -->
    <div th:replace="fragments/layout :: mobile-menu-toggle"></div>
    
    <!-- Top Header -->
    <div th:replace="fragments/layout :: header"></div>

    <!-- Main Content -->
    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-7xl mx-auto">
        
        <!-- Flash Messages -->
        <div th:replace="fragments/components :: messages"></div>

        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-3xl lg:text-4xl font-jakarta font-bold text-gray-900 mb-1">Inventario de Productos</h1>
                    <p class="text-gray-500 font-work">Administra los insumos y stock de tu cocina</p>
                </div>
                <button onclick="document.getElementById('productoModal').classList.remove('hidden')" class="btn-primary inline-flex items-center px-5 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-700 text-white font-medium shadow-md transition-colors">
                    <span class="material-symbols-outlined mr-2">add</span>
                    Nuevo Producto
                </button>
            </div>
        </div>

        <!-- Tabla de Productos -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-xs uppercase font-semibold text-gray-700 border-b border-gray-100">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Nombre</th>
                            <th class="px-6 py-4">Cantidad</th>
                            <th class="px-6 py-4">Precio</th>
                            <th class="px-6 py-4">Stock</th>
                            <th class="px-6 py-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr th:if="${productos.empty}">
                            <td colspan="6" class="px-6 py-12 text-center text-gray-400">
                                <span class="material-symbols-outlined text-4xl mb-2 text-gray-300">inventory_2</span>
                                <p class="text-base font-medium">No hay productos registrados</p>
                            </td>
                        </tr>
                        <tr th:each="producto : ${productos}" class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 font-mono text-xs text-gray-500" th:text="${producto.id}"></td>
                            <td class="px-6 py-4 font-medium text-gray-900" th:text="${producto.name}"></td>
                            <td class="px-6 py-4" th:text="${producto.cant}"></td>
                            <td class="px-6 py-4 font-semibold text-gray-800" th:text="'$' + ${#numbers.formatDecimal(producto.price, 1, 2)}"></td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800" th:text="${producto.stock}"></span>
                            </td>
                            <td class="px-6 py-4 text-center space-x-2">
                                <a th:href="@{'/producto/editar/' + ${producto.id}}" class="p-2 text-blue-600 hover:text-blue-800 rounded-lg hover:bg-blue-50 transition-colors inline-block" title="Editar">
                                    <span class="material-symbols-outlined text-lg">edit</span>
                                </a>
                                <a th:href="@{'/producto/eliminar/' + ${producto.id}}" class="p-2 text-red-600 hover:text-red-800 rounded-lg hover:bg-red-50 transition-colors inline-block"
                                   onclick="return confirm('¿Seguro que deseas eliminar este producto?')" title="Eliminar">
                                    <span class="material-symbols-outlined text-lg">delete</span>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal Crear/Editar Producto -->
        <div id="productoModal" th:classappend="${productoForm.id != null} ? '' : 'hidden'" class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-lg w-full p-6 sm:p-8 shadow-2xl relative">
                <button type="button" onclick="document.getElementById('productoModal').classList.add('hidden')" class="absolute top-5 right-5 text-gray-400 hover:text-gray-600">
                    <span class="material-symbols-outlined">close</span>
                </button>
                <h2 class="text-2xl font-bold font-jakarta text-gray-900 mb-6" th:text="${productoForm.id != null} ? 'Editar Producto' : 'Nuevo Producto'"></h2>
                
                <form th:action="@{/producto/guardar}" method="post" th:object="${productoForm}" class="space-y-4">
                    <input type="hidden" th:field="*{id}" />

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Insumo/Producto</label>
                        <input type="text" th:field="*{name}" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none" placeholder="Ej. Tomate fresco" />
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
                            <input type="number" th:field="*{cant}" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none" placeholder="10" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Precio Unitario ($)</label>
                            <input type="number" step="0.01" th:field="*{price}" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none" placeholder="2.50" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Stock (Unidades disponibles)</label>
                        <input type="number" th:field="*{stock}" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none" placeholder="50" />
                    </div>

                    <div class="pt-4 flex justify-end gap-3">
                        <button type="button" onclick="document.getElementById('productoModal').classList.add('hidden')" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 rounded-xl font-medium transition-colors">Cancelar</button>
                        <button type="submit" class="px-6 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-semibold shadow-md transition-colors" th:text="${productoForm.id != null} ? 'Actualizar' : 'Guardar Producto'"></button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="fragments/components :: footer"></div>

</body>
</html>
