services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: rskitchen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rskitchen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rskitchen"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rskitchen-net

  # 2. Administrador visual pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rskitchen-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rskitchen.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rskitchen-net

  # 3. Aplicación Spring Boot (RSKitchen)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rskitchen-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rskitchen
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GROQ_API_KEY: ${GROQ_API_KEY:-aqui}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rskitchen-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  rskitchen-net:
    driver: bridge
